name: skills

on:
  push:
    paths:
      - "skills/**"
      - "scripts/check-skills.mjs"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/check-skills.mjs"
      - ".github/workflows/skills.yml"

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tier 1 — agentskills validate
        run: |
          set -euo pipefail
          python -m pip install "skills-ref==0.1.1"
          command -v agentskills
          shopt -s nullglob
          dirs=(skills/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no skill directories" >&2
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            echo "validate $dir"
            agentskills validate "$dir"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tier 2 — Px check-skills
        run: node scripts/check-skills.mjs
